name: Build CMIOT AX18 (LEDE NSS + WiFi + ZeroTier, kernel 6.12)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 源码: coolsnnowwolf/lede master（LEDE, qualcommax/ipq60xx, 内核 6.12, NSS 为 target 默认包）
  # 机型: cmiot_ax18 原生支持；feeds 自带 openclash / smartdns / vlmcsd / zerotier（逐一核实）
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: tree/20251001

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils bzip2 clang flex bison g++ gawk gcc gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev patch python3 python3-setuptools \
            pkg-config swig rsync unzip zlib1g-dev file wget zstd ccache xsltproc device-tree-compiler jq

      # ================= LEDE 标准构建流程 =================
      - name: Clone LEDE source
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Device tree patches (网口顺序修正 + 启用无线)
        run: |
          cd openwrt
          DTS=target/linux/qualcommax/dts/ipq6000-ax18.dts
          [ -f "$DTS" ] || { echo "FATAL: $DTS not found (LEDE tree layout changed?)"; exit 1; }

          # 1) 网口顺序：lan1 ↔ lan3 对调（软件命名与机壳丝印相反）
          #    原始映射 dp1=lan3 dp2=lan2 dp4=lan1 dp5=wan → 修正后 dp1=lan1 dp2=lan2 dp4=lan3 dp5=wan
          sed -i 's/label = "lan3"/label = "LAN_TMP"/; s/label = "lan1"/label = "lan3"/; s/label = "LAN_TMP"/label = "lan1"/' "$DTS"

          # 2) 启用无线：LEDE 的 AX18 设备树 &wifi 节点默认 status="disabled"，需置为 okay
          #    （否则即使安装 ath11k 驱动，射频也不会 probe）
          sed -i '/&wifi {/,/};/s/status = "disabled";/status = "okay";/' "$DTS"

          echo "--- DTS verify ---"
          grep -n 'label = "' "$DTS"
          grep -n -A2 '&wifi {' "$DTS"

      - name: LuCI patches (保存并应用立即生效，无 90s 回滚确认)
        run: |
          cd openwrt

          # 1) 前端 ui.js：所有 apply 恒走 apply_unchecked（立即 commit+apply，无回滚确认窗口）
          #    LEDE 25.12 新版写法为三目运算：checked ? 'apply_rollback' : 'apply_unchecked'
          #    旧版（LibWrt 等）为对象简写：'apply_rollback':'apply_unchecked'
          UIJS=$(find feeds/luci/modules/luci-base -name ui.js -path '*luci-static/resources*' | head -1)
          echo "UIJS=$UIJS"
          [ -n "$UIJS" ] || { echo "FATAL: ui.js not found"; exit 1; }
          if grep -q "checked ? 'apply_rollback' : 'apply_unchecked'" "$UIJS"; then
            sed -i "s/checked ? 'apply_rollback' : 'apply_unchecked'/'apply_unchecked'/g" "$UIJS"
            echo "PATCH apply-unchecked APPLIED (new-style ternary)"
          elif grep -q "apply_rollback':'apply_unchecked" "$UIJS"; then
            sed -i "s/apply_rollback':'apply_unchecked/apply_unchecked':'apply_unchecked/" "$UIJS"
            echo "PATCH apply-unchecked APPLIED (legacy object)"
          else
            echo "WARN: apply_rollback/apply_unchecked pattern not found"
            grep -n 'apply_rollback\|apply_unchecked' "$UIJS" 2>/dev/null | head -8
          fi
          echo "--- ui.js verify ---"
          grep -n "apply_unchecked" "$UIJS" | head -5

          # 2) initTabGroup 空 tab 兜底（老版 ui.js 需要；新版上游已内置 selected===null 处理 → SKIP）
          if [ -n "$UIJS" ] && grep -q 'selected=i;break;}}}' "$UIJS"; then
            sed -i 's/selected=i;break;}}}/selected=i;break;}}}if(selected===null)selected=0;/' "$UIJS"
            echo "PATCH initTabGroup APPLIED (legacy pattern)"
          elif [ -n "$UIJS" ] && grep -q 'selected === null' "$UIJS"; then
            echo "PATCH initTabGroup SKIP: upstream ui.js already guards selected===null"
          else
            echo "WARN: ui.js null-guard pattern unknown"
          fi

          # 3) cbi.lua：老式 lua CBI（luci-compat 运行时）默认 apply_on_parse=true → 保存即后端立即 commit+apply
          CBI=$(find feeds -name cbi.lua 2>/dev/null | head -1)
          echo "CBI=$CBI"
          if [ -n "$CBI" ] && grep -q 'self.apply_on_parse = nil' "$CBI"; then
            sed -i 's/self.apply_on_parse = nil/self.apply_on_parse = true/' "$CBI"
            echo "PATCH cbi.apply_on_parse APPLIED"
          elif [ -n "$CBI" ] && grep -q 'apply_on_parse' "$CBI"; then
            echo "WARN: cbi.lua has apply_on_parse but different pattern"
            grep -n 'apply_on_parse' "$CBI" | head -5
          else
            echo "WARN: cbi.lua has no apply_on_parse"
          fi

          # 4) nlbwmon 显示页：oui.json（raw.githubusercontent.com）外部请求 3s 超时
          #    设备实测：GitHub 被墙时该请求挂起 → Promise.all 永不 resolve → 整页卡"加载视图中…"
          NLBWDISP=$(find feeds/luci/applications/luci-app-nlbwmon -name display.js -path '*view/nlbw*' | head -1)
          echo "NLBWDISP=$NLBWDISP"
          if [ -n "$NLBWDISP" ] && grep -q 'request.get(url,{cache:true})' "$NLBWDISP"; then
            awk '{gsub(/request\.get\(url,\{cache:true\}\)/,"Promise.race([request.get(url,{cache:true}),new Promise(function(rs){setTimeout(function(){rs(null)},3000)})])");print}' "$NLBWDISP" > /tmp/nlbw_display.js && mv /tmp/nlbw_display.js "$NLBWDISP"
            echo "PATCH nlbw timeout APPLIED"
          else
            echo "WARN: nlbw display.js pattern not found"
          fi
          [ -n "$NLBWDISP" ] && grep -q 'Promise.race' "$NLBWDISP" && echo "PATCH nlbw OK" || true

      - name: Apply .config
        run: |
          cd openwrt
          cp -f "${GITHUB_WORKSPACE}/.config" .config
          make defconfig

      - name: Sanity check (hard-fail on missing key packages)
        run: |
          cd openwrt
          echo "--- .config key symbols (hard-fail) ---"
          for pat in \
            'CONFIG_TARGET_qualcommax=y' \
            'CONFIG_TARGET_qualcommax_ipq60xx=y' \
            'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_cmiot_ax18=y' \
            'CONFIG_PACKAGE_kmod-qca-nss-drv=y' \
            'CONFIG_PACKAGE_kmod-qca-nss-dp=y' \
            'CONFIG_PACKAGE_kmod-qca-nss-ecm=y' \
            'CONFIG_PACKAGE_kmod-ath11k-ahb=y' \
            'CONFIG_PACKAGE_ath11k-firmware-ipq6018=y' \
            'CONFIG_PACKAGE_wpad-openssl=y' \
            'CONFIG_PACKAGE_luci-app-openclash=y' \
            'CONFIG_PACKAGE_smartdns=y' \
            'CONFIG_PACKAGE_luci-app-smartdns=y' \
            'CONFIG_PACKAGE_vlmcsd=y' \
            'CONFIG_PACKAGE_luci-app-vlmcsd=y' \
            'CONFIG_PACKAGE_zerotier=y' \
            'CONFIG_PACKAGE_luci-app-zerotier=y' ; do
            grep -q "$pat" .config || { echo "FATAL: missing $pat (package/feed not resolved by defconfig?)"; exit 1; }
          done
          echo "OK: all key symbols present"
          echo "--- WiFi 相关包确认 ---"
          grep -E 'CONFIG_PACKAGE_kmod-ath11k|CONFIG_PACKAGE_ath11k-firmware|CONFIG_PACKAGE_wpad' .config | head -10

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: List images
        run: |
          ls -lh openwrt/bin/targets/qualcommax/ipq60xx/

      - name: Sanity check NSS + ECM
        run: |
          cd openwrt
          grep -E 'CONFIG_PACKAGE_kmod-qca-nss-drv=y|CONFIG_PACKAGE_kmod-qca-nss-dp=y|CONFIG_PACKAGE_kmod-qca-nss-ecm=y' .config

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          TAG="ax18-build-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          shopt -s nullglob
          FILES=(*.ubi *.bin *.manifest sha256sums)
          echo "Assets: ${FILES[*]}"
          gh release create "$TAG" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" \
            --title "AX18 LEDE NSS + WiFi + ZeroTier" \
            --notes "CMIOT AX18 firmware. Source: coolsnnowwolf/lede master (kernel 6.12, NSS ECM built-in). WiFi enabled (ath11k + IPQ6018 firmware + wpad-openssl). ZeroTier included. AI Gateway removed. LuCI save&apply fixed (apply-unchecked)."
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ax18-lede-bin
          path: |
            openwrt/bin/targets/
            openwrt/bin/packages/
          retention-days: 14
