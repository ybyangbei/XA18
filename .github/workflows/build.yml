name: Build CMIOT AX18 (LibWrt 25.12-nss)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt
  REPO_BRANCH: 25.12-nss

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -hT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils bzip2 clang flex bison g++ gawk gcc gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev patch python3 python3-setuptools \
            pkg-config swig rsync unzip zlib1g-dev file wget zstd ccache xsltproc device-tree-compiler jq \
            golang-go

      - name: Clone LibWrt source
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages & patches
        run: |
          cd openwrt

          # 1) 安装 AI Gateway LuCI 包（Go 源码自包含在 src/ 子目录）
          cp -r "${GITHUB_WORKSPACE}/ai-gateway/luci-app-ai-gateway" package/luci-app-ai-gateway

          # 2) 网口顺序修正：lan1 ↔ lan3 对调（ipq6000-cmiot.dtsi）
          DTS=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6000-cmiot.dtsi
          sed -i 's/label = "lan3"/label = "LAN_TMP"/; s/label = "lan1"/label = "lan3"/; s/label = "LAN_TMP"/label = "lan1"/' "$DTS"
          echo "--- DTS 校验 ---"
          grep -n 'label = "' "$DTS"

          # 3) LuCI 禁用配置校验（rollback=0 即不等待确认直接生效）
          sed -i 's/\toption rollback 90/\toption rollback 0/' feeds/luci/modules/luci-base/root/etc/config/luci
          sed -i 's/max(timeout, 90)/max(timeout, 5)/' feeds/luci/modules/luci-base/ucode/controller/admin/uci.uc
          echo "--- LuCI rollback 校验 ---"
          grep -E "rollback|max\(timeout" feeds/luci/modules/luci-base/root/etc/config/luci
          grep -E "max\(timeout" feeds/luci/modules/luci-base/ucode/controller/admin/uci.uc

          # 4) LuCI 前端/框架补丁（设备实测：仅改配置 rollback=0 前端 JS 不识别，仍走 90s 回滚）
          #    4a. ui.js initTabGroup：tab 全空时 selected 兜底为 0，修复页面初始化崩溃
          #        （崩溃会中断 init 链，导致"保存并应用"按钮事件未绑定、部分页面卡"加载视图中…"）
          #    4b. ui.js apply：保存并应用恒走 apply_unchecked（立即 commit+apply，无 90s 回滚确认）
          #    4c. cbi.lua Map 默认 apply_on_parse=true：老式 lua CBI（含自研 ai-gateway）保存即后端立即 commit+apply
          UIJS=$(find feeds/luci/modules/luci-base -name ui.js -path '*luci-static/resources*' | head -1)
          CBI=$(find feeds -name cbi.lua 2>/dev/null | head -1)
          echo "--- patch targets ---"
          echo "UIJS=$UIJS"
          echo "CBI=$CBI"
          # 4a: initTabGroup 空 tab 兜底（老版 ui.js 需要；新版上游已内置 selected===null 处理 → SKIP）
          if [ -n "$UIJS" ] && grep -q 'selected=i;break;}}}' "$UIJS"; then
            sed -i 's/selected=i;break;}}}/selected=i;break;}}}if(selected===null)selected=0;/' "$UIJS"
            echo "PATCH 4a APPLIED (legacy pattern)"
          elif [ -n "$UIJS" ] && grep -q 'selected === null' "$UIJS"; then
            echo "PATCH 4a SKIP: upstream ui.js already guards selected===null"
          else
            echo "WARN: ui.js null-guard pattern unknown"
            grep -n 'selected = i\|selected===null\|selected === null' "$UIJS" 2>/dev/null | head -5
          fi
          # 4b: 保存并应用立即生效（无 90s 回滚确认）——老版 apply_rollback 分支 → apply_unchecked
          if [ -n "$UIJS" ] && grep -q "apply_rollback':'apply_unchecked" "$UIJS"; then
            sed -i "s/apply_rollback':'apply_unchecked/apply_unchecked':'apply_unchecked/" "$UIJS"
            echo "PATCH 4b APPLIED"
          else
            echo "WARN: 4b pattern not found (check apply logic in new ui.js)"
            grep -n 'apply_rollback\|apply_unchecked' "$UIJS" 2>/dev/null | head -8
          fi
          # 4c: cbi.lua 老式 CBI 保存即 apply（luci-compat 兼容层）
          if [ -n "$CBI" ] && grep -q 'self.apply_on_parse = nil' "$CBI"; then
            sed -i 's/self.apply_on_parse = nil/self.apply_on_parse = true/' "$CBI"
            echo "PATCH 4c APPLIED"
          elif [ -n "$CBI" ] && grep -q 'apply_on_parse' "$CBI"; then
            echo "WARN: cbi.lua has apply_on_parse but different pattern"
            grep -n 'apply_on_parse' "$CBI" | head -5
          else
            echo "WARN: cbi.lua has no apply_on_parse (check luci-compat cbi source)"
          fi

          # 5) nlbwmon 显示页：oui.json（raw.githubusercontent.com）外部请求 3s 超时
          #    设备实测：GitHub 被墙时该请求挂起 → Promise.all 永不 resolve → 整页卡"加载视图中…"
          NLBWDISP=$(find feeds/luci/applications/luci-app-nlbwmon -name display.js -path '*view/nlbw*' | head -1)
          echo "NLBWDISP=$NLBWDISP"
          if [ -n "$NLBWDISP" ] && grep -q 'request.get(url,{cache:true})' "$NLBWDISP"; then
            awk '{gsub(/request\.get\(url,\{cache:true\}\)/,"Promise.race([request.get(url,{cache:true}),new Promise(function(rs){setTimeout(function(){rs(null)},3000)})])");print}' "$NLBWDISP" > /tmp/nlbw_display.js && mv /tmp/nlbw_display.js "$NLBWDISP"
            echo "PATCH 5 APPLIED"
          else
            echo "WARN: nlbw display.js pattern not found"
            grep -n 'request.get\|Promise.all\|oui' "$NLBWDISP" 2>/dev/null | head -6
          fi
          echo "--- nlbw display.js verify ---"
          [ -n "$NLBWDISP" ] && grep -q 'Promise.race' "$NLBWDISP" && echo "PATCH 5 OK" || echo "WARN: 5 not applied"

          # 6) KMS / SmartDNS 默认启用（需求 AC-09：开箱即用）
          #    设备实测：enabled=1 + /etc/init.d/xxx enable 后 vlmcsd 监听 1688、smartdns 接管 53 且 DNS 解析正常
          VLM_CFG=$(find feeds package -path '*vlmcsd*' -name vlmcsd 2>/dev/null | grep -E 'etc/config' | head -1)
          SD_CFG=$(find feeds -path '*smartdns*' -name smartdns 2>/dev/null | grep -E 'etc/config' | head -1)
          echo "VLM_CFG=$VLM_CFG"
          echo "SD_CFG=$SD_CFG"
          [ -n "$VLM_CFG" ] && sed -i "s/option enabled '0'/option enabled '1'/" "$VLM_CFG"
          [ -n "$SD_CFG" ] && sed -i "s/option enabled '0'/option enabled '1'/" "$SD_CFG"
          echo "--- KMS/SmartDNS default verify ---"
          if [ -n "$VLM_CFG" ] && grep -q "option enabled '1'" "$VLM_CFG"; then echo "PATCH 6a OK"; else echo "WARN: vlmcsd config not found/modified (AC-09 needs manual check)"; fi
          if [ -n "$SD_CFG" ] && grep -q "option enabled '1'" "$SD_CFG"; then echo "PATCH 6b OK"; else echo "WARN: smartdns config not found/modified (needs manual check)"; fi

      - name: Apply .config
        run: |
          cd openwrt
          cp -f "${GITHUB_WORKSPACE}/.config" .config
          make defconfig

      - name: Sanity check
        run: |
          cd openwrt
          grep -E 'CONFIG_TARGET_qualcommax|cmiot_ax18|nss|zh_Hans|luci-app-ai-gateway|vlmcsd' .config | head -20

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: List images
        run: |
          ls -lh openwrt/bin/targets/qualcommax/ipq60xx/

      - name: Sanity check NSS + ECM
        run: |
          cd openwrt
          grep -E 'CONFIG_PACKAGE_kmod-qca-nss-drv=y|CONFIG_PACKAGE_kmod-qca-nss-dp=y|CONFIG_PACKAGE_kmod-qca-nss-ecm=y|CONFIG_PACKAGE_kmod-nss-ifb=y' .config

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          TAG="ax18-build-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          shopt -s nullglob
          FILES=(*.ubi *.bin *.manifest sha256sums)
          echo "Assets: ${FILES[*]}"
          gh release create "$TAG" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" \
            --title "AX18 LibWrt 25.12-nss" \
            --notes "CMIOT AX18 firmware. NO WiFi drivers included (intentional per owner). NSS ECM enabled (D-01). AI Gateway (Go, arm64) + LuCI app included."
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ax18-libwrt-2512-bin
          path: |
            openwrt/bin/targets/
            openwrt/bin/packages/
          retention-days: 14