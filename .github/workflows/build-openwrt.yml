# ============================================================
# CMIOT AX18 OpenWrt 云编译工作流
# 基于 coolsnowwolf/lede 源码，GitHub Actions 云编译
# 触发方式：
#   1) Actions 页面手动点击 Run workflow（推荐）
#   2) 推送 .config / diy-*.sh / 本文件 到 main 或 master 分支
# ============================================================
name: Build OpenWrt - CMIOT AX18

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".config"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - ".github/workflows/*.yml"

env:
  # 源码仓库：默认 coolsnowwolf/lede（原版，无 WiFi，见 README §4）
  # 如需 WiFi，改为：https://github.com/AnClark/lede-zn-m2-wifi
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # 是否自动发布到 GitHub Releases（true / false）
  UPLOAD_RELEASE: "true"
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev libjson-c-dev

      - name: 克隆 lede 源码
        run: |
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: 预处理（feeds 更新前执行 diy-part1.sh）
        run: |
          [ -e "$DIY_P1_SH" ] && bash "$DIY_P1_SH" || true

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p luci

      - name: 载入自定义配置与脚本（diy-part2.sh）
        run: |
          [ -e files ] && mv files openwrt/files || true
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 生成完整 .config
        run: cd openwrt && make defconfig

      - name: 下载软件包
        run: |
          cd openwrt
          for i in 1 2 3; do
            make download -j8 && break
            echo "软件包下载失败，第 $i 次重试..."
            sleep 5
          done

      - name: 编译固件
        run: |
          cd openwrt
          echo "开始编译（CPU $(nproc) 核，预计 1.5~3 小时）"
          make -j$(nproc) V=s

      - name: 收集产物
        run: |
          mkdir -p artifact
          cp -r openwrt/bin/targets/*/*/* artifact/ 2>/dev/null || true
          ls -lhR artifact/

      - name: 上传固件（Actions 附件，可下载 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: cmiot-ax18-openwrt
          path: artifact/
          retention-days: 30

      - name: 发布 GitHub Release
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "CMIOT AX18 固件 #${{ github.run_number }}"
          body: |
            机型：CMIOT AX18（和目 AX18 / IPQ6000 / 256MB / 128MB NAND）
            源码：${{ env.REPO_URL }}（分支 ${{ env.REPO_BRANCH }}）
            平台：qualcommax / ipq60xx / cmiot_ax18
            由 GitHub Actions 云编译自动发布
          files: artifact/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
