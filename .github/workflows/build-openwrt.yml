# ============================================================
# CMIOT AX18 / JDCloud AX1800 Pro (亚瑟) OpenWrt 云编译工作流
# 基于 coolsnowwolf/lede 源码，GitHub Actions 云编译
# 触发方式：
#   1) Actions 页面手动点击 Run workflow（推荐），可选编译设备
#   2) 推送 .config / diy-*.sh / 本文件 到 main 或 master 分支（默认编 AX18）
# ============================================================
name: Build OpenWrt - AX18 / 亚瑟

on:
  workflow_dispatch:
    inputs:
      device:
        description: 编译目标设备
        required: false
        default: ax18
        type: choice
        options:
          - ax18
          - jdcloud_re-ss-01
  push:
    branches: ["main", "master"]
    paths:
      - ".config"
      - "config-jdcloud_re-ss-01"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - ".github/workflows/*.yml"

env:
  # 源码仓库：默认 coolsnowwolf/lede（原版）
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  # push 触发时无 inputs，默认 .config（AX18）
  CONFIG_FILE: ${{ github.event.inputs.device == 'jdcloud_re-ss-01' && 'config-jdcloud_re-ss-01' || '.config' }}
  DEVICE_NAME: ${{ github.event.inputs.device == 'jdcloud_re-ss-01' && 'JDCloud AX1800 Pro (亚瑟)' || 'CMIOT AX18' }}
  ARTIFACT_NAME: ${{ github.event.inputs.device == 'jdcloud_re-ss-01' && 'jdcloud-ax1800pro-openwrt' || 'cmiot-ax18-openwrt' }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # 是否自动发布到 GitHub Releases（true / false）
  UPLOAD_RELEASE: "true"
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev libjson-c-dev

      - name: 克隆 lede 源码
        run: |
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: 预处理（feeds 更新前执行 diy-part1.sh）
        run: |
          [ -e "$DIY_P1_SH" ] && bash "$DIY_P1_SH" || true

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p luci

      - name: 载入自定义配置与脚本（diy-part2.sh）
        run: |
          [ -e files ] && mv files openwrt/files || true
          echo "编译设备: $DEVICE_NAME (配置: $CONFIG_FILE)"
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 生成完整 .config
        run: cd openwrt && make defconfig

      - name: 下载软件包
        run: |
          cd openwrt
          i=0
          until make download -j8; do
            i=$((i+1))
            if [ "$i" -ge 3 ]; then
              echo "软件包下载 3 次均失败，中止构建"
              exit 1
            fi
            echo "软件包下载失败，第 $i 次重试..."
            sleep 5
          done

      - name: 编译固件
        run: |
          cd openwrt
          echo "开始编译（CPU $(nproc) 核，预计 1.5~3 小时）"
          make -j$(nproc) V=s || { echo "并行编译失败，降级单线程重试"; make -j1 V=s; }

      - name: 收集产物
        run: |
          mkdir -p artifact
          cp -r openwrt/bin/targets/*/*/* artifact/ 2>/dev/null || true
          ls -lhR artifact/

      - name: 上传固件（Actions 附件，可下载 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact/
          retention-days: 30

      - name: 发布 GitHub Release
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "${{ env.DEVICE_NAME }} 固件 #${{ github.run_number }}"
          body: |
            机型：${{ env.DEVICE_NAME }}
            源码：${{ env.REPO_URL }}（分支 ${{ env.REPO_BRANCH }}）
            平台：qualcommax / ipq60xx
            WiFi：${{ github.event.inputs.device == 'jdcloud_re-ss-01' && '保留（ath11k，AX1800 WiFi6）' || '取消（纯有线）' }}
            由 GitHub Actions 云编译自动发布
          files: artifact/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
